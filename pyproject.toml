[project]
name = "de-mentorship-program"
version = "0.1.0"
description = "Data engineering design patterns — worked examples using a local stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "faker>=40.15.0",
    "kroft>=0.1.1",
    "mimesis>=19.1.0",
    "paramiko>=3.0",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "types-requests",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260508",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 88
