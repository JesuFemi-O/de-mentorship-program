[project]
name = "de-mentorship-program"
version = "0.1.0"
description = "Data engineering design patterns — worked examples using a local stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kroft>=0.1.1",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
line-length = 88
