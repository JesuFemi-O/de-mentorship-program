[project]
name = "de-mentorship-program"
version = "0.1.0"
description = "Data engineering design patterns — worked examples using a local stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kroft>=0.1.1",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 88
